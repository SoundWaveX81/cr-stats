[project]
name = "cr-total-backend"
version = "0.1.0"
description = "Clan War Management Backend Core"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1.0,<5.2.0",
    "djangorestframework>=3.15.2",
    "djangorestframework-simplejwt>=5.3.1",
    "django-environ>=0.11.2",
    "psycopg[binary]>=3.2.1",
    "celery>=5.4.0",
    "redis>=5.0.8",
    "httpx>=0.27.2",
    "discord-py>=2.7.1",
    "gunicorn>=26.2.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=8.3.2",
    "pytest-django>=4.9.0",
    "respx>=0.21.1",
    "ruff>=0.6.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"
pythonpath = ["."]
