services:
  db:
    image: postgres:16-alpine
    container_name: cr_total_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cr_total_db}
      POSTGRES_USER: ${POSTGRES_USER:-cr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cr_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cr_user} -d ${POSTGRES_DB:-cr_total_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cr_total_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cr_total_api
    restart: unless-stopped
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && python manage.py init_admin && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - ./backend:/app
      - /app/.venv
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-django-insecure-docker-dev-cr-total-2026}
      - DATABASE_URL=postgres://${POSTGRES_USER:-cr_user}:${POSTGRES_PASSWORD:-cr_password}@db:5432/${POSTGRES_DB:-cr_total_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CLASH_ROYALE_API_KEY=${API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_BOT_SECRET_TOKEN=${TELEGRAM_BOT_SECRET_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cr_total_celery_worker
    restart: unless-stopped
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
      - /app/.venv
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-django-insecure-docker-dev-cr-total-2026}
      - DATABASE_URL=postgres://${POSTGRES_USER:-cr_user}:${POSTGRES_PASSWORD:-cr_password}@db:5432/${POSTGRES_DB:-cr_total_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CLASH_ROYALE_API_KEY=${API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_BOT_SECRET_TOKEN=${TELEGRAM_BOT_SECRET_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cr_total_celery_beat
    restart: unless-stopped
    command: celery -A config beat -l info
    volumes:
      - ./backend:/app
      - /app/.venv
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-django-insecure-docker-dev-cr-total-2026}
      - DATABASE_URL=postgres://${POSTGRES_USER:-cr_user}:${POSTGRES_PASSWORD:-cr_password}@db:5432/${POSTGRES_DB:-cr_total_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CLASH_ROYALE_API_KEY=${API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_BOT_SECRET_TOKEN=${TELEGRAM_BOT_SECRET_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cr_total_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - api

  tunnel:
    image: ngrok/ngrok:latest
    container_name: cr_total_tunnel
    restart: unless-stopped
    profiles:
      - tunnel
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}
    command:
      - "http"
      - "--url=${NGROK_DOMAIN:-}"
      - "--log=stdout"
      - "http://frontend:80"
    depends_on:
      - frontend

volumes:
  postgres_data:
  redis_data:
